<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#007bff" stroke="#0056b3" stroke-width="2"/>

  <!-- Paint palette shape -->
  <ellipse cx="50" cy="52" rx="35" ry="30" fill="#ffffff"/>

  <!-- Thumb hole -->
  <ellipse cx="35" cy="70" rx="8" ry="6" fill="#007bff"/>

  <!-- Paint colors on palette -->
  <circle cx="45" cy="42" r="5" fill="#ff6b6b"/>
  <circle cx="60" cy="40" r="5" fill="#ffd93d"/>
  <circle cx="52" cy="52" r="5" fill="#6bcf7f"/>
  <circle cx="42" cy="58" r="5" fill="#a78bfa"/>
  <circle cx="58" cy="56" r="5" fill="#fb923c"/>

  <!-- Paintbrush -->
  <g transform="translate(65, 25) rotate(45)">
    <!-- Brush handle -->
    <rect x="0" y="0" width="3" height="20" fill="#8b5a3c" rx="1"/>
    <!-- Brush ferrule -->
    <rect x="-1" y="20" width="5" height="4" fill="#c0c0c0"/>
    <!-- Brush bristles -->
    <path d="M 1.5 24 L 0 30 L 3 30 Z" fill="#4a4a4a"/>
  </g>
</svg>

